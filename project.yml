name: Roostprint
options:
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: 1,2
targets:
  Roostprint:
    type: application
    platform: iOS
    sources:
    - App
    - Shared
    - WidgetSupport
    - Config/ThirdPartyNotices.txt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.roostprint.press
        INFOPLIST_KEY_CFBundleDisplayName: SuperBerint
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Config/Phone.plist
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
    dependencies:
    - target: RoostprintWidget
      embed: true
  RoostprintTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - Tests
    dependencies:
    - target: Roostprint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.roostprint.press.tests
  RoostprintUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - UITests
    dependencies:
    - target: Roostprint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.roostprint.press.uitests
  RoostprintWidget:
    type: app-extension
    platform: iOS
    sources:
    - Widget
    - Shared
    - Config/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.roostprint.press.widget
        INFOPLIST_FILE: Config/Widget.plist
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
        TARGETED_DEVICE_FAMILY: 1,2
        SKIP_INSTALL: 'YES'
        APPLICATION_EXTENSION_API_ONLY: 'YES'
schemes:
  Roostprint:
    build:
      targets:
        Roostprint: all
    test:
      targets:
      - RoostprintTests
      - RoostprintUITests
  RoostprintWidget:
    build:
      targets:
        RoostprintWidget: all
